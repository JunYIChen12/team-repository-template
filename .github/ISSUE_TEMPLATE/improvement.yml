name: 规范改进建议
description: 建议新增或修改团队协作规则与模板
title: "[改进] "
labels: []
body:
  - type: textarea
    id: situation
    attributes:
      label: 真实用户场景
      description: 谁在什么情况下，正在完成什么业务动作？
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 实际遇到的问题
      description: 说明用户看到了什么问题、造成了什么影响以及如何复现。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
      description: 说明验收时应该看到的可观察结果，不要预设唯一技术实现。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围和非目标
      description: 说明这次要解决什么，以及明确不处理什么。
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 影响范围
      description: 哪些项目、角色或流程需要调整？是否兼容现有做法？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 讨论中的方案（可选）
      description: 如果已有想法可以记录，但它不是 Issue 的前置条件，最终实现方案放在契约、设计记录或 PR 中。
  - type: textarea
    id: verification
    attributes:
      label: 如何验证有效
      description: 给出可以判断建议是否解决问题的标准。
    validations:
      required: true

